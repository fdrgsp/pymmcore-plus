ci:
  autoupdate_schedule: monthly
  autofix_commit_msg: "style(pre-commit.ci): auto fixes [...]"
  autoupdate_commit_msg: "ci(pre-commit.ci): autoupdate"

repos:
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.50.3
    hooks:
      - id: typos
        args: [--force-exclude]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --unsafe-fixes]
      - id: ruff-format

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: '0.26'
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: "^src/"
        additional_dependencies:
          - pymmcore >=11.6.0.73.0
          - ome-writers >=0.3.2
          # the fork: the engine uses fields (hardware autofocus search, software
          # autofocus) that only it has, so PyPI's useq makes these spurious errors
          - useq-schema @ git+https://github.com/fdrgsp/useq-schema@cite
          - psygnal
          - typer
